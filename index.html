<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ربات ریاضی | اعداد زوج و فرد | کلاس ششم</title>

<meta name="theme-color" content="#2B7CFF">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===========================================
صفحه معرفی ربات
=========================================== -->

<section id="introPage">

    <img
        src="background.png"
        id="introBackground"
        alt="Background">

    <div id="introOverlay"></div>

    <div id="introContainer">

        <img
            src="robot-sleep.png"
            id="introRobot"
            alt="Robot">

        <div id="introSpeech">

            سلام دوست من 🌸

        </div>

        <div id="introLoading">

            <div id="loadingBar">

                <div id="loadingFill"></div>

            </div>

        </div>

    </div>

</section>



<!-- ===========================================
صفحه ورود
=========================================== -->

<section id="loginPage" class="hidden">

    <img
        src="background.png"
        id="loginBackground"
        alt="Background">

    <div id="loginOverlay"></div>

    <div id="loginContainer">

        <img
            src="robot.png"
            id="loginRobot"
            alt="Robot">

        <h1>

            بازی ربات ریاضی

        </h1>

        <h2>

            اعداد زوج و فرد

        </h2>

        <input

            type="text"

            id="studentName"

            autocomplete="off"

            placeholder="نام و نام خانوادگی">

        <input

            type="tel"

            id="studentCode"

            autocomplete="off"

            maxlength="10"

            inputmode="numeric"

            placeholder="کد ملی">

        <div id="loginError">

        </div>

        <button id="startBtn">

            شروع بازی

        </button>

    </div>

</section>
<!-- ===========================================
صفحه اصلی بازی
=========================================== -->

<section id="gamePage" class="hidden">

    <img
        src="background.png"
        id="gameBackground"
        alt="Background">

    <div id="gameOverlay"></div>

    <!-- نوار بالای بازی -->

    <header id="topBar">

        <div class="statusItem">

            <img
                src="battery.png"
                class="statusIcon"
                alt="Battery">

            <span id="batteryValue">

                0%

            </span>

        </div>

        <div class="statusItem">

            <img
                src="star.png"
                class="statusIcon"
                alt="Star">

            <span id="starValue">

                0

            </span>

        </div>

        <div class="statusItem">

            <img
                src="coin.png"
                class="statusIcon"
                alt="Coin">

            <span id="coinValue">

                0

            </span>

        </div>

    </header>



    <!-- ربات -->

    <section id="robotArea">

        <img
            src="robot.png"
            id="robot"
            alt="Robot">

    </section>



    <!-- متن ربات -->

    <section id="speechArea">

        <div id="speechBox">

            آماده‌ای؟

        </div>

    </section>



    <!-- نوار شارژ باتری -->

    <section id="batteryProgress">

        <div id="batteryFill"></div>

    </section>



    <!-- سوال -->

    <section id="questionArea">

        <div id="questionBox">

        </div>


 <!-- ===========================================
صفحه پایان بازی
=========================================== -->

<section id="finishPage" class="hidden">

    <img
        src="background.png"
        id="finishBackground"
        alt="Background">

    <div id="finishOverlay"></div>

    <div id="finishContainer">

        <img
            src="robot-winner.png"
            id="finishRobot"
            alt="Winner Robot">

        <h1>

            مأموریت با موفقیت انجام شد 🎉

        </h1>

        <div id="resultCard">

            <p>
                👤 نام و نام خانوادگی:
                <span id="resultName"></span>
            </p>

            <p>
                🆔 کد ملی:
                <span id="resultCode"></span>
            </p>

            <p>
                📚 بازی:
                ربات ریاضی | اعداد زوج و فرد
            </p>

            <p>
                👩‍🏫 آموزگار:
                پونه سلامی
            </p>

            <p>
                📅 تاریخ:
                <span id="resultDate"></span>
            </p>

            <p>
                🕒 ساعت:
                <span id="resultTime"></span>
            </p>

            <p>
                ✅ پاسخ صحیح:
                <span id="correctCount"></span>
            </p>

            <p>
                ❌ پاسخ نادرست:
                <span id="wrongCount"></span>
            </p>

            <p>
                🎯 امتیاز:
                <span id="resultScore"></span>
            </p>

            <p>
                📈 درصد موفقیت:
                <span id="resultPercent"></span>
            </p>
