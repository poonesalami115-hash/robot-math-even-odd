<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ربات ریاضی | زوج و فرد | کلاس ششم</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!--==============================
صفحه معرفی ربات
===============================-->

<div id="introPage">

    <img src="background.png" id="introBackground">

    <div id="introOverlay"></div>

    <div id="introContent">

        <img
            src="robot-sleep.png"
            id="introRobot">

        <div id="introSpeech">

            ...

        </div>

    </div>

</div>



<!--==============================
صفحه ورود
===============================-->

<div id="loginPage" class="hidden">

    <img src="background.png" id="loginBackground">

    <div id="loginOverlay"></div>

    <div id="loginBox">

        <img
            src="robot.png"
            id="loginRobot">

        <h1>

            بازی ربات ریاضی

        </h1>

        <h2>

            اعداد زوج و فرد

        </h2>

        <input

            type="text"

            id="studentName"

            placeholder="نام و نام خانوادگی">

        <input

            type="tel"

            id="studentCode"

            maxlength="10"

            placeholder="کد ملی">

        <button id="startBtn">

            شروع بازی

        </button>

    </div>

</div>
<!--==============================
صفحه بازی
===============================-->

<div id="gamePage" class="hidden">

    <img src="background.png" id="gameBackground">

    <div id="gameOverlay"></div>

    <!-- نوار بالا -->

    <header id="topBar">

        <div class="topItem">

            <img src="battery.png">

            <span id="batteryValue">

                0%

            </span>

        </div>

        <div class="topItem">

            <img src="star.png">

            <span id="starValue">

                0

            </span>

        </div>

        <div class="topItem">

            <img src="coin.png">

            <span id="coinValue">

                0

            </span>

        </div>

    </header>



    <!-- ربات -->

    <section id="robotArea">

        <img

            src="robot.png"

            id="robot">

    </section>



    <!-- کادر صحبت -->

    <section id="speechBox">

        سلام!

    </section>



    <!-- سوال -->

    <section id="questionBox">

        سؤال اینجا نمایش داده می‌شود.

    </section>



    <!-- گزینه‌ها -->

    <section id="answersBox">

    </section>



    <!-- نوار پیشرفت -->

    <section id="progressBar">

        <div id="progressFill">

        </div>

    </section>

</div>
<!--==============================
صفحه پایان بازی
===============================-->

<div id="finishPage" class="hidden">

    <img src="background.png" id="finishBackground">

    <div id="finishOverlay"></div>

    <div id="finishBox">

        <img
            src="robot-winner.png"
            id="finishRobot">

        <h1>

            مأموریت با موفقیت انجام شد!

        </h1>

        <div id="resultInfo">

            <p>

                👤 نام و نام خانوادگی:

                <span id="resultName"></span>

            </p>

            <p>

                🆔 کد ملی:

                <span id="resultCode"></span>

            </p>

            <p>

                ⭐ امتیاز:

                <span id="resultScore"></span>

            </p>

            <p>

                🔋 شارژ ربات:

                <span id="resultBattery"></span>

            </p>

            <p>

                🪙 سکه‌ها:

                <span id="resultCoins"></span>

            </p>

            <p>

                ⭐ ستاره‌ها:

                <span id="resultStars"></span>

            </p>

        </div>

        <div id="medalBox">

            <img
                src="medal-bronze.png"
                id="resultMedal">

        </div>

        <p id="teacherName">

            آموزگار: پونه سلامی

        </p>

        <button id="screenShotBtn">

            📸 گرفتن اسکرین‌شات

        </button>

    </div>

</div>



<script src="questions.js"></script>

<script src="game.js"></script>

</body>

</html>
